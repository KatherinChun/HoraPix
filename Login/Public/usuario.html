<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.7);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin: 2px 8px;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,.1);
            color: #fff;
        }
        .sidebar .nav-link.active {
            background: rgba(255,255,255,.15);
            color: #fff;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        .main-content {
            background: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-person"></i> Panel Usuario
            </a>
            <div class="d-flex">
                <span class="navbar-text text-light me-3">
                    <i class="bi bi-person-circle"></i> 
                    <span id="nombreUsuario">Usuario</span>
                    <span class="badge bg-info ms-2">USUARIO</span>
                </span>
                <button class="btn btn-outline-light" id="btnLogout">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL CON SIDEBAR -->
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR DINÁMICO -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <h6 class="text-white-50 text-uppercase px-3 py-2">MENÚ</h6>
                    <ul class="nav flex-column" id="menuDinamico">
                        <li class="nav-item">
                            <span class="text-white-50 px-3">Cargando menú...</span>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 col-lg-10 ms-sm-auto main-content">
                <div id="contenidoPrincipal">
                    <!-- El contenido se carga dinámicamente -->
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/usuario.js"></script>
</body>
</html>
