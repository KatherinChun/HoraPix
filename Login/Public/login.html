<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bienvenido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-box-seam display-1 text-primary"></i>
                            <h2 class="mt-2 fw-bold">Bienvenido</h2>
                            <p class="text-muted">Inicia sesión para continuar</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-semibold">
                                    <i class="bi bi-person"></i> Usuario
                                </label>
                                <input type="text" class="form-control form-control-lg" 
                                       id="usuario" placeholder="Ingresa tu usuario" 
                                       required autofocus>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">
                                    <i class="bi bi-lock"></i> Contraseña
                                </label>
                                <input type="password" class="form-control form-control-lg" 
                                       id="password" placeholder="Ingresa tu contraseña" 
                                       required>
                            </div>
                            
                            <div id="mensaje" class="alert d-none" role="alert"></div>
                            
                            <button type="submit" class="btn btn-primary btn-lg w-100" id="btnLogin">
                                <span id="btnText"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                        </form>

                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="text-muted small mb-0">
                                <i class="bi bi-info-circle"></i> Usuarios de prueba:
                            </p>
                            <div class="row mt-2">
                                <div class="col-6">
                                    <span class="badge bg-primary">Admin</span>
                                    <small class="d-block text-muted">admin / 12345</small>
                                </div>
                                <div class="col-6">
                                    <span class="badge bg-success">Usuario</span>
                                    <small class="d-block text-muted">juan / 12345</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
