<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoraPix - Acceso al Sistema</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-main);
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
    }
    .hidden { display: none; }
  </style>
</head>
<body class="auth-page">

  <div class="card auth-card">
    <div class="text-center mb-4">
      <h2 style="color: var(--primary);">⏰ HoraPix</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Plataforma de Citas</p>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" id="login-email" class="form-control" required placeholder="usuario@correo.com">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Entrar</button>
    </form>

    <!-- Registration Form -->
    <form id="register-form" class="hidden">
      <h3 class="card-title text-center mb-4">Crear Cuenta</h3>
      <div class="form-group">
        <label class="form-label">Nombre Completo</label>
        <input type="text" id="reg-name" class="form-control" required placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" id="reg-email" class="form-control" required placeholder="usuario@correo.com">
      </div>
      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="tel" id="reg-phone" class="form-control" placeholder="+502 5555-5555">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="reg-password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Registrarse</button>
    </form>

    <div class="text-center mt-4">
      <a href="#" id="toggle-auth" style="font-size: 0.9rem;">¿No tienes cuenta? Regístrate aquí</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
