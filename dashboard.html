<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoraPix - Mi Panel</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        HoraPix
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="active">📅 Mis Citas</a></li>
        <li><a href="index.html">➕ Nueva Cita</a></li>
      </ul>
      <div class="sidebar-footer">
        <button onclick="Auth.logout()" class="btn btn-secondary btn-sm" style="width: 100%;">Cerrar Sesión</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="flex-between mb-4">
        <div>
          <h2>Bienvenido, <span id="user-name-display">Usuario</span></h2>
          <p style="color: var(--text-muted);">Gestiona tus citas programadas e historial.</p>
        </div>
        <a href="index.html" class="btn btn-primary">+ Agendar Nueva Cita</a>
      </div>

      <!-- Appointments List Table -->
      <div class="table-container mt-4">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Servicio</th>
              <th>Fecha y Hora</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="appointments-list">
            <!-- Dynamic appointments loaded here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
