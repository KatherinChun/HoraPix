<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoraPix - Sistema Inteligente de Citas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

  <!-- Navbar Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span> HoraPix</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Inicio</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="login.html" class="btn btn-outline btn-sm">Iniciar Sesión</a></li>
      </ul>
    </div>
  </header>

  <!-- Hero Section -->
  <section style="padding: 60px 0; background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%); text-align: center;">
    <div class="container">
      <h1 style="font-size: 2.5rem; margin-bottom: 16px; color: var(--text-main);">Reserva tu Cita en Segundos</h1>
      <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 24px;">
        HoraPix simplifica la gestión y agenda de tus turnos de forma rápida, automatizada y confiable.
      </p>
      <a href="#servicios" class="btn btn-primary">Ver Servicios Disponibles</a>
    </div>
  </section>

  <!-- Services Grid -->
  <section id="servicios" style="padding: 60px 0;">
    <div class="container">
      <h2 class="text-center mb-4" style="font-size: 1.8rem;">Nuestros Servicios</h2>
      <div id="services-grid" class="grid grid-3 mt-4">
        <!-- Dynamic services render here -->
      </div>
    </div>
  </section>

  <!-- Booking Modal -->
  <div id="booking-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-service-title" class="card-title">Agendar Cita</h3>
        <button id="close-modal"
          style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <form id="booking-form">
        <input type="hidden" id="modal-service-id">
        <div class="form-group">
          <label class="form-label">Nombre Completo</label>
          <input type="text" id="booking-name" class="form-control" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="booking-email" class="form-control" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Fecha</label>
          <input type="date" id="booking-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Hora</label>
          <input type="time" id="booking-time" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Confirmar Cita</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
