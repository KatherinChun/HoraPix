<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoraPix · Panel</title>
<style>
:root{
  --navy-900:#0B1524; --navy-800:#111E33; --navy-700:#1B2A42; --navy-600:#28394F;
  --pink-500:#E31C79; --pink-600:#C2135F; --pink-50:#FDEAF1;
  --bg:#F5F6FA; --white:#FFFFFF;
  --text:#111827; --text-soft:#6B7280; --border:#E5E7EB;
  --success:#16A34A; --success-bg:#DCFCE7;
  --warning:#B45309; --warning-bg:#FEF3C7;
  --danger:#DC2626;  --danger-bg:#FEE2E2;
  --neutral-bg:#F3F4F6; --neutral-text:#374151;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px rgba(15,23,42,.10);
  --shadow-lg:0 20px 45px rgba(15,23,42,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sidebar-w:240px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--pink-500);outline-offset:2px;}
svg{display:block;}

/* ---------- Shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--navy-900);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-logo{font-size:1.2rem;font-weight:800;padding:22px 22px 18px;}
.sidebar-logo .pix{color:var(--pink-500);}
.sidebar-nav{flex:1;padding:8px 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#AEB9CB;font-size:.88rem;font-weight:600;margin-bottom:4px;transition:background-color .15s ease,color .15s ease;}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--navy-700);color:#fff;}
.nav-item.active{background:var(--pink-500);color:#fff;}
.sidebar-foot{padding:16px;border-top:1px solid var(--navy-700);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0;}
.user-meta strong{display:block;font-size:.82rem;}
.user-meta span{font-size:.72rem;color:#8493A8;}
.btn-logout{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px solid var(--navy-700);color:#CBD5E1;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:.82rem;font-weight:600;}
.btn-logout:hover{background:var(--navy-700);color:#fff;}

.main{flex:1;min-width:0;}
.mobile-topbar{display:none;align-items:center;gap:14px;background:var(--navy-900);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:30;}
.mobile-topbar button{background:none;border:0;color:#fff;cursor:pointer;padding:4px;}
.mobile-topbar .title{font-weight:700;font-size:.95rem;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(11,21,36,.5);z-index:35;}
.sidebar-backdrop.visible{display:block;}

#viewRoot{padding:32px 36px;max-width:1080px;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.view-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:24px;}
.view-header h1{font-size:1.35rem;margin:0;}
.view-header .search{position:relative;}
.view-header .search input{width:250px;padding:.6rem 1rem .6rem 2.2rem;border:1.5px solid var(--border);border-radius:9px;font-size:.86rem;font-family:inherit;}
.view-header .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-soft);}
select.period-select{padding:.55rem .9rem;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.85rem;font-weight:600;background:#fff;}

.card{background:#fff;border-radius:var(--radius-md);border:1px solid var(--border);}
.empty-state{text-align:center;padding:52px 20px;color:var(--text-soft);}
.empty-state svg{margin:0 auto 14px;opacity:.5;}
.empty-state p{margin:0;font-size:.92rem;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.badge-pendiente{background:var(--warning-bg);color:var(--warning);}
.badge-aprobada{background:var(--success-bg);color:var(--success);}
.badge-rechazada,.badge-cancelada{background:var(--danger-bg);color:var(--danger);}
.badge-completada{background:var(--neutral-bg);color:var(--neutral-text);}

/* ---------- Citas de hoy ---------- */
.cita-card{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:12px;flex-wrap:wrap;}
.cita-card.pendiente{border-left-color:var(--warning);}
.cita-card.aprobada{border-left-color:var(--success);}
.cita-card.rechazada,.cita-card.cancelada{border-left-color:var(--danger);}
.cita-card.completada{border-left-color:#9CA3AF;}
.cita-time{font-weight:800;min-width:74px;font-size:.92rem;}
.cita-info{flex:1;min-width:160px;}
.cita-info strong{display:block;font-size:.92rem;}
.cita-info span{font-size:.78rem;color:var(--text-soft);}
.cita-actions{display:flex;align-items:center;gap:12px;}

/* ---------- Botones ---------- */
.btn{font-size:.84rem;font-weight:700;border-radius:9px;padding:.6rem 1.1rem;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s ease,box-shadow .15s ease;}
.btn-dark{background:var(--navy-900);color:#fff;}
.btn-dark:hover{background:#040a13;}
.btn-pink{background:var(--pink-500);color:#fff;}
.btn-pink:hover{background:var(--pink-600);}
.btn-outline{background:#fff;border-color:var(--border);color:var(--navy-900);}
.btn-outline:hover{border-color:var(--navy-800);}
.btn-danger-outline{background:#fff;border-color:var(--danger-bg);color:var(--danger);}
.btn-danger-outline:hover{background:var(--danger-bg);}
.btn-sm{padding:.42rem .8rem;font-size:.78rem;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}

/* ---------- Calendario ---------- */
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-nav button{background:#fff;border:1.5px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.cal-nav button:hover{border-color:var(--navy-800);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border);}
.cal-dow{padding:10px;text-align:center;font-size:.7rem;font-weight:800;letter-spacing:.05em;color:var(--text-soft);border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#FAFBFC;}
.cal-day{min-height:96px;padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background-color .15s ease;}
.cal-day:hover{background:var(--pink-50);}
.cal-day.outside{background:#FAFBFC;color:#C3CBD6;}
.cal-day.today{background:#FFF8FB;}
.cal-day .num{font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.cal-day.today .num{background:var(--pink-500);color:#fff;width:22px;height:22px;border-radius:50%;}
.cal-chip{display:block;font-size:.64rem;font-weight:700;padding:2px 5px;border-radius:5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-chip.pendiente{background:var(--warning-bg);color:var(--warning);}
.cal-chip.aprobada{background:var(--success-bg);color:var(--success);}
.cal-chip.rechazada,.cal-chip.cancelada{background:var(--danger-bg);color:var(--danger);}
.cal-chip.completada{background:var(--neutral-bg);color:var(--neutral-text);}
.cal-more{font-size:.64rem;color:var(--text-soft);margin-top:3px;font-weight:700;}
@media (max-width:760px){ .cal-day{min-height:64px;} .cal-chip{display:none;} .cal-more{display:block;} }

/* ---------- Clientes ---------- */
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);padding:12px 18px;border-bottom:1px solid var(--border);}
tbody td{padding:14px 18px;border-bottom:1px solid var(--border);font-size:.88rem;vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
.contact-cell span{display:block;}
.contact-cell .muted{color:var(--text-soft);font-size:.78rem;}

/* ---------- Reportes ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px;}
.stat-card{padding:20px;}
.stat-card .label{font-size:.76rem;color:var(--text-soft);font-weight:700;margin-bottom:8px;}
.stat-card .value{font-size:1.7rem;font-weight:800;}
.delta{font-size:.78rem;font-weight:800;margin-left:8px;}
.delta.up{color:var(--success);}
.delta.down{color:var(--danger);}
.chart-card{padding:24px;}
.chart-card h3{margin:0 0 20px;font-size:.92rem;color:var(--navy-800);}
.chart{display:flex;align-items:flex-end;gap:22px;height:190px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar{width:100%;max-width:56px;border-radius:8px 8px 0 0;background:var(--navy-800);transition:height .6s cubic-bezier(.2,.8,.2,1);}
.bar.current{background:var(--pink-500);}
.bar-label{margin-top:10px;font-size:.72rem;color:var(--text-soft);font-weight:700;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(11,21,36,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:var(--radius-lg);max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:28px;position:relative;box-shadow:var(--shadow-lg);}
.modal.modal-wide{max-width:600px;}
.modal h3{margin:0 0 4px;font-size:1.1rem;}
.modal .modal-sub{font-size:.83rem;color:var(--text-soft);margin:0 0 18px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:0;cursor:pointer;color:var(--text-soft);font-size:1.15rem;padding:4px;}
.kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:.86rem;}
.kv-row:last-child{border-bottom:0;}
.kv-row span:first-child{color:var(--text-soft);}
.kv-row span:last-child{font-weight:700;text-align:right;}
.doc-placeholder{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:14px;margin:14px 0;}
.doc-placeholder .name{font-weight:700;font-size:.84rem;}
.doc-placeholder .hint{font-size:.74rem;color:var(--text-soft);}
.modal-section-title{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);margin:20px 0 8px;}
.history-row{display:flex;justify-content:space-between;padding:8px 0;font-size:.84rem;border-bottom:1px solid var(--border);}
.history-row:last-child{border-bottom:0;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;justify-content:center;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-900);color:#fff;padding:16px 22px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;gap:12px;max-width:420px;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:200;}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast strong{display:block;margin-bottom:2px;font-size:.9rem;}
.toast p{margin:0;font-size:.82rem;color:#CBD5E1;}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s ease;z-index:40;}
  .sidebar.open{transform:translateX(0);}
  .mobile-topbar{display:flex;}
  #viewRoot{padding:22px 18px;}
  .view-header .search input{width:100%;}
  .stat-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important;} }
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">HORA<span class="pix">PIX</span></div>
    <nav class="sidebar-nav" aria-label="Navegación del panel">
      <a href="#citas-hoy" class="nav-item" data-view="citas-hoy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 3v4M15 3v4M4 11h16"/></svg>

      </a>
      <a href="#reportes" class="nav-item" data-view="reportes">

    <div class="sidebar-foot">

      </div>

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="mobile-topbar">
      <button id="btnOpenSidebar" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span class="title" id="mobileTitle">HoraPix</span>
    </div>
    <main id="viewRoot"></main>
  </div>
</div>

<!-- Modal: detalle / revisión de una cita -->
<div class="modal-overlay" id="citaModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="citaModalTitle">
    <button class="modal-close" aria-label="Cerrar" onclick="cerrarModal('citaModal')">✕</button>
    <h3 id="citaModalTitle"></h3>
    <p class="modal-sub" id="citaModalSub"></p>
    <div id="citaModalBody"></div>
  </div>
</div>

<!-- Modal: detalle de un día del calendario -->
<div class="modal-overlay" id="diaModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="diaModalTitle">
    <button class="modal-close" aria-label="Cerrar" onclick="cerrarModal('diaModal')">✕</button>
    <h3 id="diaModalTitle"></h3>
    <div id="diaModalBody"></div>
  </div>
</div>

<!-- Modal: ficha de cliente -->
<div class="modal-overlay" id="clienteModal">
  <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="clienteModalTitle">
    <button class="modal-close" aria-label="Cerrar" onclick="cerrarModal('clienteModal')">✕</button>
    <h3 id="clienteModalTitle"></h3>
    <p class="modal-sub" id="clienteModalSub"></p>
    <div id="clienteModalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span aria-hidden="true">✅</span>
  <div><strong id="toastTitle"></strong><p id="toastBody"></p></div>
</div>

<script>
/* =====================================================================
   0. UTILIDADES
   ===================================================================== */
function escapeHTML(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function delay(ms){ return new Promise(r => setTimeout(r, ms)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function addDays(base, days){ const d = new Date(base); d.setDate(d.getDate()+days); return d; }
function shiftMonth(year, month, delta){ const d = new Date(year, month+delta, 1); return { year:d.getFullYear(), month:d.getMonth() }; }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function formatHora12(hhmm){ const [h,m]=hhmm.split(':').map(Number); const suf=h>=12?'PM':'AM'; const h12=(h%12)||12; return `${h12}:${pad2(m)} ${suf}`; }
function formatMesAnio(year, month){ const n = new Date(year,month,1).toLocaleDateString('es-GT',{month:'long'}); return `${n.charAt(0).toUpperCase()+n.slice(1)} ${year}`; }
function formatFechaCorta(iso){ const d=new Date(iso+'T00:00:00'); const mes=d.toLocaleDateString('es-GT',{month:'long'}); return `${d.getDate()} ${mes.charAt(0).toUpperCase()+mes.slice(1)} ${d.getFullYear()}`; }
function formatFechaLarga(iso){ const d=new Date(iso+'T00:00:00'); const s=d.toLocaleDateString('es-GT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function calcularEdad(fechaISO){
  const n = new Date(fechaISO+'T00:00:00'); const hoy = new Date();
  let edad = hoy.getFullYear()-n.getFullYear();
  const m = hoy.getMonth()-n.getMonth();
  if (m<0 || (m===0 && hoy.getDate()<n.getDate())) edad--;
  return edad;
}
function deltaHTML(n){ const up = n>=0; return `<span class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(n)}%</span>`; }
function estadoClase(estado){
  const map = { PENDIENTE:'pendiente', APROBADA:'aprobada', RECHAZADA:'rechazada', CANCELADA:'cancelada', COMPLETADA:'completada' };
  return map[estado] || 'completada';
}
function badgeHTML(estado){ return `<span class="badge badge-${estadoClase(estado)}">${escapeHTML(estado)}</span>`; }

/* =====================================================================
   1. DATOS MOCK (etapa de vista) — misma forma que devolverá la API real
   ===================================================================== */
const HOY = new Date(); HOY.setHours(0,0,0,0);

const MOCK_CLIENTES = [
  { id_cliente:1, nombre:'Ana López', email:'ana.lpz@email.com', telefono:'+502 5555-8834', fecha_nacimiento:'1990-04-12', direccion:'Zona 10, Ciudad de Guatemala', alergias:'Ninguna conocida', medicamentos_actuales:'Sertralina 50mg', notas_medicas:'Seguimiento por ansiedad generalizada; evolución favorable.' },
  { id_cliente:2, nombre:'Carlos Ruiz', email:'carlos.ruiz@email.com', telefono:'+502 5555-0192', fecha_nacimiento:'1985-11-02', direccion:'Zona 15, Ciudad de Guatemala', alergias:'Penicilina', medicamentos_actuales:'Ninguno', notas_medicas:'Primera consulta por manejo de estrés laboral.' },
  { id_cliente:3, nombre:'Sofía Marroquín', email:'sofia.marroquin@email.com', telefono:'+502 5555-2201', fecha_nacimiento:'1998-02-27', direccion:'Mixco, Guatemala', alergias:'Ninguna conocida', medicamentos_actuales:'Ninguno', notas_medicas:'Control mensual, avances positivos.' },
  { id_cliente:4, nombre:'Luis Pineda', email:'luis.pineda@email.com', telefono:'+502 5555-7745', fecha_nacimiento:'1979-07-19', direccion:'Villa Nueva, Guatemala', alergias:'Aspirina', medicamentos_actuales:'Losartán 50mg', notas_medicas:'Referido por medicina general; primera cita psicológica.' }
];

let MOCK_CITAS = [

/* =====================================================================
   2. CAPA DE DATOS — HoraPixAPI
   Cada método: implementación MOCK activa + llamada REAL comentada.
   (En la versión modular vive en /js/api.js compartido)
   ===================================================================== */
const API_BASE = 'http://localhost:8000'; // TODO: URL real (HTTPS)

const HoraPixAPI = (() => {

  async function getSesionActual(){
    // ---- MOCK ----
    const raw = sessionStorage.getItem('horapix_sesion');
    return raw ? JSON.parse(raw) : null;
    // ---- REAL ----
    // const res = await fetch(`${API_BASE}/api/auth/me`, { credentials:'include' });
    // if (!res.ok) return null;
    // return res.json();
  }

  async function logout(){
    // ---- MOCK ----
    sessionStorage.removeItem('horapix_sesion');
    document.cookie = 'horapix_demo=; path=/; Max-Age=0';
    // ---- REAL ----
    // await fetch(`${API_BASE}/api/auth/logout`, { method:'POST', credentials:'include' });
  }

  async function getCitasPorFecha(iso){
    // ---- MOCK ----
    await delay(300);
    return MOCK_CITAS.filter(c => c.fecha === iso).map(joinCliente).sort((a,b) => a.hora_inicio.localeCompare(b.hora_inicio));
    // ---- REAL ----
    // const res = await fetch(`${API_BASE}/api/citas?fecha=${iso}`, { credentials:'include' });
    // if (!res.ok) throw new Error('No se pudieron cargar las citas.');
    // return res.json();
  }

  async function getCitasPorMes(year, month){
    // ---- MOCK ----
    await delay(300);
    const prefijo = `${year}-${pad2(month+1)}`;
    return MOCK_CITAS.filter(c => c.fecha.startsWith(prefijo)).map(joinCliente);
    // ---- REAL ----
    // const res = await fetch(`${API_BASE}/api/citas/calendario?year=${year}&month=${month+1}`, { credentials:'include' });
    // if (!res.ok) throw new Error('No se pudo cargar el calendario.');
    // return res.json();
  }

  async function actualizarEstadoCita(id_cita, nuevoEstado){
    // ---- MOCK ----
    await delay(400);
    const cita = MOCK_CITAS.find(c => c.id_cita === id_cita);
    if (!cita) throw new Error('Cita no encontrada.');
    cita.estado = nuevoEstado;
    if (cita.comprobante && (nuevoEstado === 'APROBADA' || nuevoEstado === 'RECHAZADA')){
      cita.comprobante.estado = nuevoEstado === 'APROBADA' ? 'APROBADO' : 'RECHAZADO';
    }
    return joinCliente(cita);
    // ---- REAL ----
    // const res = await fetch(`${API_BASE}/api/citas/${id_cita}/estado`, {
    //   method:'PATCH', credentials:'include',
    //   headers:{ 'Content-Type':'application/json', 'X-CSRF-Token': getCsrfTokenFromCookie() },
    //   body: JSON.stringify({ estado: nuevoEstado })
    // });
    // if (!res.ok) throw new Error('No se pudo actualizar el estado de la cita.');
    // return res.json();
  }

  async function getClientes(query){
    // ---- MOCK ----
    await delay(250);
    const q = (query || '').toLowerCase().trim();
    return MOCK_CLIENTES
      .filter(c => !q || c.nombre.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.telefono.includes(q))
      .map(c => ({ ...c, ultima_cita: ultimaCitaDe(c.id_cliente) }));
    // ---- REAL ----
    // const qs = query ? `?q=${encodeURIComponent(query)}` : '';
    // const res = await fetch(`${API_BASE}/api/clientes${qs}`, { credentials:'include' });
    // if (!res.ok) throw new Error('No se pudo cargar el directorio de clientes.');
    // return res.json();
  }

  async function getClienteDetalle(id_cliente){
    // ---- MOCK ----
    await delay(250);
    const cliente = MOCK_CLIENTES.find(c => c.id_cliente === id_cliente);
    if (!cliente) throw new Error('Cliente no encontrado.');
    const historial = MOCK_CITAS.filter(c => c.id_cliente === id_cliente).sort((a,b) => b.fecha.localeCompare(a.fecha));
    return { ...cliente, historial };
    // ---- REAL ----
    // const res = await fetch(`${API_BASE}/api/clientes/${id_cliente}`, { credentials:'include' });
    // if (!res.ok) throw new Error('No se pudo cargar la ficha del cliente.');
    // return res.json();
  }

  async function getRendimiento(periodo){
    // ---- MOCK ----
    await delay(300);
    return REPORTES_MOCK[periodo] || REPORTES_MOCK.mes;
    // ---- REAL ----
    // const res = await fetch(`${API_BASE}/api/reportes/rendimiento?periodo=${periodo}`, { credentials:'include' });
    // if (!res.ok) throw new Error('No se pudo cargar el reporte.');
    // return res.json();
  }

  function joinCliente(cita){
    const cliente = MOCK_CLIENTES.find(c => c.id_cliente === cita.id_cliente);
    return { ...cita, cliente: cliente ? { id_cliente:cliente.id_cliente, nombre:cliente.nombre, telefono:cliente.telefono, email:cliente.email } : null };
  }
  function ultimaCitaDe(id_cliente){
    const pasadas = MOCK_CITAS.filter(c => c.id_cliente === id_cliente && c.fecha <= toISO(HOY)).sort((a,b) => b.fecha.localeCompare(a.fecha));
    return pasadas.length ? pasadas[0].fecha : null;
  }

  return { getSesionActual, logout, getCitasPorFecha, getCitasPorMes, actualizarEstadoCita, getClientes, getClienteDetalle, getRendimiento };
})();

      <div class="modal-actions">
        <button class="btn btn-danger-outline" data-decision="RECHAZADA">Rechazar</button>
        <button class="btn btn-pink" data-decision="APROBADA">Aprobar</button>

          await HoraPixAPI.actualizarEstadoCita(cita.id_cita, btn.dataset.decision);
          cerrarModal('citaModal');

  document.getElementById('calNext').addEventListener('click', () => { const s = shiftMonth(estadoCalendario.year, estadoCalendario.month, 1); estadoCalendario.year = s.year; estadoCalendario.month = s.month; pintarCalendario(); });

function generarCeldas(year, month){
  const primerDiaSemana = (new Date(year, month, 1).getDay() + 6) % 7; // 0 = lunes
  const diasEnMes = new Date(year, month+1, 0).getDate();
  const diasMesAnterior = new Date(year, month, 0).getDate();
  const prev = shiftMonth(year, month, -1);
  const next = shiftMonth(year, month, 1);
  const celdas = [];
  for (let i = primerDiaSemana - 1; i >= 0; i--){
    const d = diasMesAnterior - i;
    celdas.push({ dia:d, outside:true, iso: isoDate(prev.year, prev.month, d) });
  }
  for (let d = 1; d <= diasEnMes; d++) celdas.push({ dia:d, outside:false, iso: isoDate(year, month, d) });
  let nd = 1;
  while (celdas.length % 7 !== 0){ celdas.push({ dia:nd, outside:true, iso: isoDate(next.year, next.month, nd) }); nd++; }
  return celdas;
}

async function pintarCalendario(){
  document.getElementById('calMesAnio').textContent = formatMesAnio(estadoCalendario.year, estadoCalendario.month);
  const citasMes = await HoraPixAPI.getCitasPorMes(estadoCalendario.year, estadoCalendario.month);
  const porDia = {};
  citasMes.forEach(c => { (porDia[c.fecha] ||= []).push(c); });

  const dow = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
  const celdas = generarCeldas(estadoCalendario.year, estadoCalendario.month);
  const isoHoy = toISO(HOY);

  let html = dow.map(d => `<div class="cal-dow">${d}</div>`).join('');
  html += celdas.map(cel => {
    const citasDia = (porDia[cel.iso] || []).sort((a,b) => a.hora_inicio.localeCompare(b.hora_inicio));
    const visibles = citasDia.slice(0,2);
    const resto = citasDia.length - visibles.length;
    const chips = visibles.map(c => `<span class="cal-chip ${estadoClase(c.estado)}">${formatHora12(c.hora_inicio)} ${escapeHTML(c.cliente.nombre.split(' ')[0])}</span>`).join('');
    const mas = resto > 0 ? `<span class="cal-more">+${resto} más</span>` : '';
    return `<div class="cal-day ${cel.outside?'outside':''} ${cel.iso===isoHoy?'today':''}" data-iso="${cel.iso}">
      <span class="num">${cel.dia}</span>${chips}${mas}
    </div>`;
  }).join('');

  const grid = document.getElementById('calGrid');
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day').forEach(el => el.addEventListener('click', () => onDayClick(el.dataset.iso)));
}

function onDayClick(iso){
  const [y,m] = iso.split('-').map(Number);
  if (y !== estadoCalendario.year || (m-1) !== estadoCalendario.month){
    estadoCalendario.year = y; estadoCalendario.month = m-1;
    pintarCalendario().then(() => abrirDetalleDia(iso));
  } else {
    abrirDetalleDia(iso);
  }
}

async function abrirDetalleDia(iso){
  document.getElementById('diaModalTitle').textContent = formatFechaLarga(iso);
  const citas = await HoraPixAPI.getCitasPorFecha(iso);
  const body = document.getElementById('diaModalBody');
  if (!citas.length){
    body.innerHTML = `<p class="empty-note" style="color:var(--text-soft);font-size:.88rem;">Sin citas programadas este día.</p>`;
  } else {
    body.innerHTML = citas.map(c => `
      <div class="history-row">
        <span>${formatHora12(c.hora_inicio)} · ${escapeHTML(c.cliente.nombre)}</span>
        ${badgeHTML(c.estado)}
      </div>`).join('');
  }
  abrirModal('diaModal');
}

      <td><button class="btn btn-dark btn-sm" data-ver-ficha="${c.id_cliente}">Ver Ficha</button></td>
    </tr>`).join('');
  body.querySelectorAll('[data-ver-ficha]').forEach(btn => btn.addEventListener('click', () => abrirFichaCliente(Number(btn.dataset.verFicha))));
}

async function abrirFichaCliente(id_cliente){
  const c = await HoraPixAPI.getClienteDetalle(id_cliente);
  document.getElementById('clienteModalTitle').textContent = c.nombre;
  document.getElementById('clienteModalSub').textContent = `${calcularEdad(c.fecha_nacimiento)} años · ${c.email}`;

  const historialHTML = c.historial.length
    ? c.historial.map(h => `<div class="history-row"><span>${formatFechaCorta(h.fecha)} · ${formatHora12(h.hora_inicio)}</span>${badgeHTML(h.estado)}</div>`).join('')
    : `<p style="color:var(--text-soft);font-size:.85rem;">Sin citas registradas.</p>`;

  document.getElementById('clienteModalBody').innerHTML = `
    <div class="kv-row"><span>Teléfono</span><span>${escapeHTML(c.telefono)}</span></div>
    <div class="kv-row"><span>Dirección</span><span>${escapeHTML(c.direccion)}</span></div>
    <div class="modal-section-title">Información clínica</div>
    <div class="kv-row"><span>Alergias</span><span>${escapeHTML(c.alergias)}</span></div>
    <div class="kv-row"><span>Medicamentos actuales</span><span>${escapeHTML(c.medicamentos_actuales)}</span></div>
    <div class="kv-row"><span>Notas médicas</span><span>${escapeHTML(c.notas_medicas)}</span></div>
    <div class="modal-section-title">Historial de citas</div>
    ${historialHTML}`;
  abrirModal('clienteModal');
}

/* =====================================================================
   7. VISTA: REPORTES
   ===================================================================== */
async function renderReportes(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="view-header">
      <h1>Rendimiento - ${escapeHTML(formatMesAnio(HOY.getFullYear(), HOY.getMonth()))}</h1>
      <select class="period-select" id="periodoSelect">
        <option value="mes">Este Mes</option>
        <option value="mes_pasado">Mes Pasado</option>
        <option value="anio">Este Año</option>
      </select>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="card chart-card"><h3>Flujo de Citas Semanal</h3><div class="chart" id="chart"></div></div>`;

  document.getElementById('periodoSelect').addEventListener('change', (e) => pintarReportes(e.target.value));
  await pintarReportes('mes');
}

async function pintarReportes(periodo){
  const r = await HoraPixAPI.getRendimiento(periodo);
  document.getElementById('statGrid').innerHTML = `
    <div class="card stat-card"><div class="label">Citas Completadas</div><div class="value">${r.citas_completadas}${deltaHTML(r.delta_completadas)}</div></div>
    <div class="card stat-card"><div class="label">Nuevos Clientes</div><div class="value">${r.nuevos_clientes}${deltaHTML(r.delta_clientes)}</div></div>
    <div class="card stat-card"><div class="label">Cancelaciones</div><div class="value">${r.cancelaciones}${deltaHTML(r.delta_cancelaciones)}</div></div>`;

  const max = Math.max(...r.flujo.map(f => f.valor)) * 1.15;
  const chart = document.getElementById('chart');
  chart.innerHTML = r.flujo.map(f => `
    <div class="bar-col">
      <div class="bar ${f.actual?'current':''}" data-target="${(f.valor/max*100).toFixed(1)}" style="height:0%"></div>
      <span class="bar-label">${escapeHTML(f.label)}</span>
    </div>`).join('');
  requestAnimationFrame(() => {
    chart.querySelectorAll('.bar').forEach(b => { b.style.height = `${b.dataset.target}%`; });
  });
}

/* =====================================================================
   8. MODALES Y TOAST (compartidos)
   ===================================================================== */
function abrirModal(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function cerrarModal(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => cerrarModal(m.id)); });
document.addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) cerrarModal(e.target.id); });

let toastTimer;
function mostrarToast(titulo, cuerpo){
  const toast = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = titulo;
  document.getElementById('toastBody').textContent = cuerpo;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 5000);
}
</script>
